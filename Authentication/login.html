<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Residence - Login</title>
  <!-- <link rel="stylesheet" href="./login.css"> -->

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../Bootstrap/css/bootstrap.min.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #34495e;
      --accent-color: #3498db;
      --light-color: #ecf0f1;
      --dark-color: #2c3e50;
      --error-color: #e74c3c;
      --success-color: #2ecc71;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f5f7fa;
      background-image: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
      height: 100vh;
      margin: 0;
      padding: 0;
      color: var(--dark-color);
    }
    .header-bar {
  padding: 10px 20px;
  background:linear-gradient(135deg,blue,white,blue);
  color: whitesmoke;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 0 15px #0ff4;
  height: 100px;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}
.logo{
  border-radius: 50%;
}
/* Centering Login Box */
.login-wrapper {
  flex-grow: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
    
    
    
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 80px);
      padding: 20px;
    }
    
    .login-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-top: 4px solid var(--accent-color);
    }
    
    .login-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }
    
    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      padding-bottom: 15px;
    }
    
    .login-title:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--accent-color);
    }
    
    .form-label {
      font-weight: 600;
      color: var(--secondary-color);
      margin-bottom: 8px;
      display: block;
    }
    
    .form-control {
      height: 45px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: none;
    }
    
    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
    }
    
    .btn-signin {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      cursor: pointer;
      margin-top: 20px;
    }
    
    .btn-signin:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
    
    .btn-signin:active {
      transform: translateY(0);
    }
    
    .text-danger {
      font-size: 0.85rem;
      margin-top: 5px;
      display: block;
    }
    
    .input-group {
      position: relative;
    }
    
    .input-group .form-control {
      padding-right: 40px;
    }
    
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--secondary-color);
    }
    
    /* Responsive adjustments */
    @media (max-width: 576px) {
      .login-box {
        padding: 30px 20px;
      }
      
      .header-bar h2 {
        font-size: 1.5rem;
      }
    }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .login-box {
      animation: fadeIn 0.6s ease-out forwards;
    }
  </style>
</head>

<body>
  <!-- Header Bar -->
   <div class="header-bar">
    <img src="../images/Silicon university.png" alt="Logo" width="70px" class="logo" />
    <h2>Silicon Residence</h2>
  </div>

  <!-- Centered Login Section -->
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-title">Login</div>
      <form id="loginForm">
        <div class="mb-4">
          <label class="form-label">USER NAME</label>
          <input type="text" class="form-control" id="userId" placeholder="Enter your user ID" />
          <span id="userIdError" class="text-danger"></span>
        </div>
        <div class="mb-4">
          <label class="form-label">PASSWORD</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="Enter your password" />
            <i class="toggle-password fas fa-eye" onclick="togglePasswordVisibility()"></i>
          </div>
          <span id="passwordError" class="text-danger"></span>
        </div>
        <input type="submit" class="btn-signin" value="Sign In" />
      </form>
    </div>
  </div>

  <!-- Script -->
  <script src="../Bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../Jquery/jquery-3.7.1.js"></script>
  <script>
    function togglePasswordVisibility() {
      const passwordField = document.getElementById("password");
      const toggleIcon = document.querySelector(".toggle-password");
      
      if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        passwordField.type = "password";
        toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }
    
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      let isValid = true;

      let userId = document.getElementById("userId").value.trim();
      let password = document.getElementById("password").value.trim();
      let userIdPattern = /^[0-9]{2}[a-zA-Z]{4}[0-9]{2}$/;

      document.getElementById("userIdError").innerText = "";
      document.getElementById("passwordError").innerText = "";

      if (userId === "") {
        document.getElementById("userIdError").innerText = "User ID cannot be empty.";
        isValid = false;
      } else if (userId !== "admin@silicon.ac.in" && !userId.match(userIdPattern)) {
        document.getElementById("userIdError").innerText = "Invalid User ID";
        isValid = false;
      }

      if (password === "") {
        document.getElementById("passwordError").innerText = "Password cannot be empty.";
        isValid = false;
      }

      if (isValid) {
        $.ajax({
          url: "login.php",
          method: "POST",
          data: { 'userId': userId, 'password': password },
          success: function (data) {
            console.log(data,"hello");
            if (data.trim()=== "Admin True Data") {
              window.location.href = "../Admin/admin_dashboard.php";
            } else if (data === "Admin False Data") {
              document.getElementById("passwordError").innerText = "UserId/Password incorrect. Try Again!";
              document.getElementById("passwordError").style.color = "var(--error-color)";
            }else if(data === "Student True Data"){
              window.location = "../Student/student_dashboard.php";
            }else{
              document.getElementById("passwordError").innerText = "UserId/Password incorrect. Try Again!";
              document.getElementById("passwordError").style.color = "var(--error-color)";
            }
          }
        });
      }
    });
  </script>
</body>
</html>
